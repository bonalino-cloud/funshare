name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # Сборка без секретов: env читается лениво, на этапе build ключи не нужны.
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # Промпты и canary-строки не должны попасть в то, что уходит в браузер (roast-engine §8).
      - run: pnpm exec tsx scripts/ci/check-bundle-leaks.ts
